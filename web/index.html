<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ShopFlow</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">

<style>
  :root {
    --bg: #f7f7f5;
    --surface: #ffffff;
    --surface-soft: #f1f1ee;
    --border: #e7e5e0;
    --ink: #171717;
    --muted: #737373;
    --accent: #111111;
    --accent-soft: #e9e9e5;
    --danger: #c62828;
    --success: #287a4b;
    --radius: 16px;
    --shadow: 0 8px 30px rgba(0, 0, 0, 0.05);
  }

  * {
    box-sizing: border-box;
  }

  html {
    scroll-behavior: smooth;
  }

  body {
    margin: 0;
    font-family:
      Inter, -apple-system, BlinkMacSystemFont,
      "Segoe UI", system-ui, sans-serif;
    background: var(--bg);
    color: var(--ink);
  }

  button,
  input,
  select {
    font: inherit;
  }

  /* ================= HEADER ================= */

  header {
    background: rgba(255, 255, 255, 0.92);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 20;
    backdrop-filter: blur(14px);
  }

  .nav {
    max-width: 1200px;
    margin: auto;
    padding: 18px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
  }

  .logo {
    font-size: 22px;
    font-weight: 800;
    letter-spacing: -0.04em;
  }

  .logo span {
    color: #777;
  }

  .nav-right {
    display: flex;
    align-items: center;
    gap: 24px;
    font-size: 14px;
    color: var(--muted);
  }

  .nav-right a {
    color: inherit;
    text-decoration: none;
    transition: color 0.2s ease;
  }

  .nav-right a:hover {
    color: var(--ink);
  }

  /* ================= HERO ================= */

  .hero {
    max-width: 1200px;
    margin: auto;
    padding: 70px 24px 45px;
  }

  .hero-inner {
    background: #171717;
    color: white;
    border-radius: 24px;
    padding: 52px;
    position: relative;
    overflow: hidden;
  }

  .hero-inner::after {
    content: "";
    position: absolute;
    width: 280px;
    height: 280px;
    border-radius: 50%;
    right: -80px;
    top: -100px;
    background: rgba(255,255,255,0.07);
  }

  .hero-label {
    display: inline-block;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: #bdbdbd;
    margin-bottom: 14px;
  }

  .hero h1 {
    margin: 0;
    max-width: 650px;
    font-size: clamp(36px, 5vw, 62px);
    line-height: 1.02;
    letter-spacing: -0.055em;
  }

  .hero p {
    margin: 20px 0 0;
    max-width: 520px;
    color: #bdbdbd;
    font-size: 16px;
    line-height: 1.7;
  }

  /* ================= CONTROLS ================= */

  .controls-wrap {
    max-width: 1200px;
    margin: auto;
    padding: 0 24px 25px;
  }

  .controls {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 12px;
    display: flex;
    align-items: center;
    gap: 10px;
    box-shadow: var(--shadow);
  }

  .search-box {
    position: relative;
    flex: 1;
  }

  .search-box svg {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    color: #999;
    pointer-events: none;
  }

  input[type="search"],
  select {
    width: 100%;
    height: 46px;
    border: 1px solid transparent;
    border-radius: 12px;
    background: var(--surface-soft);
    color: var(--ink);
    outline: none;
    transition: all 0.2s ease;
  }

  input[type="search"] {
    padding: 0 15px 0 43px;
  }

  select {
    padding: 0 38px 0 14px;
    cursor: pointer;
  }

  input[type="search"]:focus,
  select:focus {
    background: white;
    border-color: #bdbdbd;
  }

  label.check {
    height: 46px;
    padding: 0 15px;
    display: flex;
    align-items: center;
    gap: 8px;
    white-space: nowrap;
    border-radius: 12px;
    background: var(--surface-soft);
    color: var(--muted);
    font-size: 14px;
    cursor: pointer;
  }

  label.check input {
    accent-color: #111;
  }

  /* ================= MAIN ================= */

  main {
    max-width: 1200px;
    margin: auto;
    padding: 10px 24px 70px;
  }

  .top-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
  }

  .section-title {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -0.03em;
  }

  .status {
    color: var(--muted);
    font-size: 14px;
  }

  /* ================= GRID ================= */

  .grid {
    display: grid;
    gap: 22px;
    grid-template-columns: repeat(4, minmax(0, 1fr));
  }

  /* ================= CARD ================= */

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    transition:
      transform 0.25s ease,
      box-shadow 0.25s ease,
      border-color 0.25s ease;
  }

  .card:hover {
    transform: translateY(-5px);
    box-shadow: 0 18px 40px rgba(0,0,0,0.09);
    border-color: #d5d3ce;
  }

  .image-wrap {
    overflow: hidden;
    background: #eeeeeb;
    position: relative;
  }

  .card img {
    width: 100%;
    aspect-ratio: 1 / 1;
    object-fit: cover;
    display: block;
    transition: transform 0.45s ease;
  }

  .card:hover img {
    transform: scale(1.045);
  }

  .body {
    padding: 18px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    flex: 1;
  }

  .cat {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: #858585;
    font-weight: 700;
  }

  .card h2 {
    font-size: 16px;
    margin: 0;
    font-weight: 650;
    letter-spacing: -0.02em;
  }

  .card p {
    margin: 0;
    color: var(--muted);
    font-size: 13px;
    line-height: 1.55;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-top: 10px;
  }

  .price {
    font-size: 17px;
    font-weight: 750;
    letter-spacing: -0.02em;
  }

  .stock {
    font-size: 11px;
    color: var(--success);
    background: #edf7f0;
    padding: 5px 9px;
    border-radius: 999px;
    font-weight: 600;
  }

  .stock.out {
    color: var(--danger);
    background: #fff0f0;
  }

  /* ================= EMPTY / ERROR ================= */

  .empty {
    grid-column: 1 / -1;
    padding: 80px 20px;
    text-align: center;
    color: var(--muted);
    background: var(--surface);
    border: 1px dashed var(--border);
    border-radius: var(--radius);
  }

  .error {
    grid-column: 1 / -1;
    background: #fff3f3;
    border: 1px solid #ffd1d1;
    color: var(--danger);
    padding: 18px;
    border-radius: var(--radius);
    font-size: 14px;
  }

  /* ================= RESPONSIVE ================= */

  @media (max-width: 950px) {
    .grid {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .hero-inner {
      padding: 42px;
    }
  }

  @media (max-width: 720px) {
    .nav-right {
      display: none;
    }

    .hero {
      padding-top: 30px;
    }

    .hero-inner {
      padding: 34px 28px;
      border-radius: 20px;
    }

    .controls {
      flex-direction: column;
      align-items: stretch;
    }

    .grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }
  }

  @media (max-width: 480px) {
    .grid {
      grid-template-columns: 1fr;
    }

    main,
    .controls-wrap,
    .hero {
      padding-left: 16px;
      padding-right: 16px;
    }

    .hero h1 {
      font-size: 38px;
    }
  }
</style>
</head>

<body>

<header>
  <nav class="nav">
    <div class="logo">Shop<span>Flow</span></div>

    <div class="nav-right">
      <a href="#">Products</a>
      <a href="#">Categories</a>
      <a href="#">About</a>
    </div>
  </nav>
</header>


<section class="hero">
  <div class="hero-inner">
    <div class="hero-label">ShopFlow Collection</div>

    <h1>
      Simple products.<br>
      Better shopping.
    </h1>

    <p>
      Discover carefully selected products in one clean,
      effortless shopping experience.
    </p>
  </div>
</section>


<div class="controls-wrap">
  <div class="controls">

    <div class="search-box">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="7"></circle>
        <path d="m20 20-4-4"></path>
      </svg>

      <input
        type="search"
        id="q"
        placeholder="Search products..."
      >
    </div>

    <select id="category">
      <option value="">All categories</option>
    </select>

    <label class="check">
      <input type="checkbox" id="inStock">
      In stock only
    </label>

  </div>
</div>


<main>

  <div class="top-row">
    <div class="section-title">All Products</div>
    <div class="status" id="status">Loading...</div>
  </div>

  <div class="grid" id="grid"></div>

</main>


<script>

const els = {
  q: document.getElementById('q'),
  category: document.getElementById('category'),
  inStock: document.getElementById('inStock'),
  grid: document.getElementById('grid'),
  status: document.getElementById('status'),
};


const money = (cents, currency) =>
  new Intl.NumberFormat('en-US', {
    style: 'currency',
    currency: currency || 'USD'
  }).format(cents / 100);


const escapeHTML = (s) =>
  String(s).replace(/[&<>"']/g, (c) =>
    ({
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      '"': '&quot;',
      "'": '&#39;'
    }[c])
  );


async function loadCategories() {

  try {

    const res = await fetch('/api/categories');
    const data = await res.json();

    for (const c of data.categories) {

      const opt = document.createElement('option');

      opt.value = c;

      opt.textContent =
        c.charAt(0).toUpperCase() + c.slice(1);

      els.category.append(opt);
    }

  } catch (err) {

    console.error('categories failed', err);

  }
}


async function loadProducts() {

  const params = new URLSearchParams();

  if (els.q.value.trim()) {
    params.set('q', els.q.value.trim());
  }

  if (els.category.value) {
    params.set('category', els.category.value);
  }

  if (els.inStock.checked) {
    params.set('in_stock', 'true');
  }

  els.status.textContent = 'Loading...';

  try {

    const res =
      await fetch('/api/products?' + params);

    if (!res.ok) {

      const body =
        await res.json().catch(() => ({}));

      throw new Error(
        body.error?.message ||
        `server said ${res.status}`
      );
    }

    const data = await res.json();

    render(data.products);

    els.status.textContent =
      `${data.count} product${data.count === 1 ? '' : 's'}`;

  } catch (err) {

    els.grid.innerHTML = '';

    els.status.innerHTML =
      `<div class="error">
        Could not load products:
        ${escapeHTML(err.message)}
      </div>`;
  }
}


function render(products) {

  if (!products.length) {

    els.grid.innerHTML = `
      <div class="empty">
        Nothing matches your search.
      </div>
    `;

    return;
  }


  els.grid.innerHTML = products.map((p) => `

    <article class="card">

      <div class="image-wrap">

        <img
          src="${escapeHTML(p.image_url)}"
          alt="${escapeHTML(p.name)}"
          loading="lazy"
          onerror="this.style.visibility='hidden'"
        >

      </div>


      <div class="body">

        <div class="cat">
          ${escapeHTML(p.category)}
        </div>

        <h2>
          ${escapeHTML(p.name)}
        </h2>

        <p>
          ${escapeHTML(p.description)}
        </p>

        <div class="row">

          <span class="price">
            ${money(p.price_cents, p.currency)}
          </span>

          <span class="stock ${p.stock > 0 ? '' : 'out'}">
            ${
              p.stock > 0
                ? p.stock + ' in stock'
                : 'Sold out'
            }
          </span>

        </div>

      </div>

    </article>

  `).join('');
}


let timer;

const debounced = () => {

  clearTimeout(timer);

  timer = setTimeout(loadProducts, 250);

};


els.q.addEventListener('input', debounced);

els.category.addEventListener(
  'change',
  loadProducts
);

els.inStock.addEventListener(
  'change',
  loadProducts
);


loadCategories();

loadProducts();

</script>

</body>
</html>
